spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# "update" é conveniente para desenvolver; em produção use Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# Lê o arquivo .env (se existir) na pasta do projeto. Veja .env.exemplo
spring.config.import=optional:file:./.env[.properties]

# Login do dono (a senha NÃO fica no código: vem do arquivo .env ou da variável de ambiente)
app.admin.usuario=${ADMIN_USER:admin}
app.admin.senha=${ADMIN_PASSWORD:}

server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
# Em produção (com HTTPS) defina COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
